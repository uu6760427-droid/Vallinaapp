<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VPN Client</title>
    <!-- Font Awesome для иконок (можно заменить на SVG) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== Глобальные стили ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            background: #0b0e1a;
            color: #f0f0f0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        /* Контейнер приложения (имитация мобильного экрана) */
        .app {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 820px;
            background: linear-gradient(145deg, #12162a, #1a1f3a);
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            margin: 0 16px;
        }
        /* ===== Страницы ===== */
        .page {
            flex: 1;
            padding: 24px 20px 80px;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .page.active {
            display: flex;
        }
        .page::-webkit-scrollbar {
            display: none;
        }

        /* ===== Главная ===== */
        #page-home {
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .status-label {
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #8892b0;
            margin-bottom: 12px;
        }
        .status-text {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 40px;
            transition: color 0.3s;
        }
        .status-text.connected {
            color: #4ade80;
        }
        .status-text.disconnected {
            color: #f87171;
        }

        /* Круглая кнопка включения */
        .btn-toggle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #3b82f6, #8b5cf6, #ec4899, #3b82f6);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s, box-shadow 0.3s;
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.3);
            margin-bottom: 30px;
            /* Анимация пульсации (по умолчанию выкл) */
            animation: pulse-off 2s infinite ease-in-out;
        }
        .btn-toggle .inner {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #12162a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            color: #8892b0;
            transition: all 0.3s;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .btn-toggle .inner i {
            transition: transform 0.5s;
        }

        /* Состояние ВКЛ */
        .btn-toggle.active {
            animation: pulse-on 1.5s infinite ease-in-out;
            box-shadow: 0 0 60px rgba(74, 222, 128, 0.5);
        }
        .btn-toggle.active .inner {
            background: #1a2a1a;
            color: #4ade80;
        }
        .btn-toggle.active .inner i {
            transform: rotate(360deg);
        }

        /* Анимации пульсации */
        @keyframes pulse-off {
            0% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); transform: scale(1); }
            50% { box-shadow: 0 0 50px rgba(59, 130, 246, 0.4); transform: scale(1.02); }
            100% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); transform: scale(1); }
        }
        @keyframes pulse-on {
            0% { box-shadow: 0 0 30px rgba(74, 222, 128, 0.3); transform: scale(1); }
            50% { box-shadow: 0 0 80px rgba(74, 222, 128, 0.7); transform: scale(1.05); }
            100% { box-shadow: 0 0 30px rgba(74, 222, 128, 0.3); transform: scale(1); }
        }

        /* Дополнительная анимация вращения фона */
        .btn-toggle .bg-spin {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.1), transparent, rgba(255,255,255,0.1));
            animation: spin 6s linear infinite;
            pointer-events: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== Страница подписок ===== */
        #page-subscriptions .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        #page-subscriptions h2 {
            font-size: 22px;
            font-weight: 500;
        }
        .add-sub-form {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .add-sub-form input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid #2a2f4a;
            background: #1a1f3a;
            color: #f0f0f0;
            font-size: 14px;
            outline: none;
        }
        .add-sub-form input:focus {
            border-color: #3b82f6;
        }
        .add-sub-form button {
            padding: 12px 20px;
            border: none;
            border-radius: 16px;
            background: #3b82f6;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .add-sub-form button:hover {
            background: #2563eb;
        }
        .sub-list {
            list-style: none;
            padding: 0;
        }
        .sub-list li {
            background: #1a1f3a;
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #3b82f6;
            word-break: break-all;
        }
        .sub-list li .url {
            font-size: 13px;
            color: #a0aec0;
            max-width: 70%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .sub-list li .del-btn {
            background: none;
            border: none;
            color: #f87171;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
        }
        .sub-list li .del-btn:hover {
            color: #ef4444;
        }
        .empty-msg {
            text-align: center;
            color: #4a4f6a;
            margin-top: 40px;
            font-size: 16px;
        }

        /* ===== Страница настроек ===== */
        #page-settings {
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        #page-settings .info {
            background: #1a1f3a;
            padding: 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 300px;
        }
        #page-settings .info i {
            font-size: 56px;
            color: #3b82f6;
            margin-bottom: 16px;
        }
        #page-settings .info h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }
        #page-settings .info p {
            color: #8892b0;
            font-size: 14px;
            line-height: 1.6;
        }
        .version {
            margin-top: 20px;
            color: #4a4f6a;
            font-size: 12px;
        }

        /* ===== Нижняя навигация ===== */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(18, 22, 42, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid #2a2f4a;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 12px;
            border-radius: 0 0 32px 32px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #4a4f6a;
            cursor: pointer;
            transition: color 0.2s;
            font-size: 12px;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 12px;
        }
        .nav-item i {
            font-size: 24px;
        }
        .nav-item.active {
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }
        .nav-item:hover {
            color: #8892b0;
        }

        /* ===== Адаптивность ===== */
        @media (max-width: 420px) {
            .app {
                border-radius: 0;
                max-height: 100vh;
                margin: 0;
            }
            .bottom-nav {
                border-radius: 0;
            }
        }
        /* Скрываем скролл */
        .app {
            -ms-overflow-style: none;
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- ===== Главная страница ===== -->
        <div class="page active" id="page-home">
            <div class="status-label">Состояние</div>
            <div class="status-text disconnected" id="statusText">Отключено</div>
            <div class="btn-toggle" id="btnToggle">
                <div class="bg-spin"></div>
                <div class="inner">
                    <i class="fas fa-power-off"></i>
                </div>
            </div>
            <div style="margin-top: 20px; font-size: 14px; color: #4a4f6a;">
                <i class="fas fa-shield-alt"></i> Защита включена
            </div>
        </div>

        <!-- ===== Страница подписок ===== -->
        <div class="page" id="page-subscriptions">
            <div class="header">
                <h2><i class="fas fa-list-ul"></i> Подписки</h2>
                <span style="font-size: 14px; color:#4a4f6a;" id="subCount">0</span>
            </div>
            <div class="add-sub-form">
                <input type="url" id="subInput" placeholder="Введите URL подписки..." />
                <button id="addSubBtn"><i class="fas fa-plus"></i> Добавить</button>
            </div>
            <ul class="sub-list" id="subList">
                <!-- Список будет заполняться JS -->
            </ul>
            <div class="empty-msg" id="emptyMsg">Нет добавленных подписок</div>
        </div>

        <!-- ===== Страница настроек ===== -->
        <div class="page" id="page-settings">
            <div class="info">
                <i class="fas fa-cog"></i>
                <h3>VPN Client</h3>
                <p>Версия 1.0.0<br />Стиль вдохновлён Haap / Karing</p>
                <div class="version">Сделано с ❤️</div>
            </div>
        </div>

        <!-- ===== Нижнее меню ===== -->
        <div class="bottom-nav">
            <div class="nav-item active" data-page="home">
                <i class="fas fa-home"></i>
                <span>Главная</span>
            </div>
            <div class="nav-item" data-page="subscriptions">
                <i class="fas fa-link"></i>
                <span>Подписки</span>
            </div>
            <div class="nav-item" data-page="settings">
                <i class="fas fa-sliders-h"></i>
                <span>Настройки</span>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  ЛОГИКА ПРИЛОЖЕНИЯ
        // ============================================================

        // --- Элементы ---
        const btnToggle = document.getElementById('btnToggle');
        const statusText = document.getElementById('statusText');
        const subList = document.getElementById('subList');
        const subInput = document.getElementById('subInput');
        const addSubBtn = document.getElementById('addSubBtn');
        const emptyMsg = document.getElementById('emptyMsg');
        const subCount = document.getElementById('subCount');

        // --- Состояние ---
        let isConnected = false;
        let subscriptions = [];

        // Загрузка из localStorage
        function loadData() {
            const saved = localStorage.getItem('vpn_subscriptions');
            if (saved) {
                try {
                    subscriptions = JSON.parse(saved);
                } catch (e) {
                    subscriptions = [];
                }
            }
            renderSubscriptions();
        }
        function saveData() {
            localStorage.setItem('vpn_subscriptions', JSON.stringify(subscriptions));
        }

        // --- Переключение страниц ---
        const navItems = document.querySelectorAll('.nav-item');
        const pages = {
            home: document.getElementById('page-home'),
            subscriptions: document.getElementById('page-subscriptions'),
            settings: document.getElementById('page-settings')
        };

        function switchPage(pageId) {
            // Скрыть все
            Object.values(pages).forEach(p => p.classList.remove('active'));
            // Показать нужную
            if (pages[pageId]) pages[pageId].classList.add('active');
            // Обновить навигацию
            navItems.forEach(item => {
                item.classList.toggle('active', item.dataset.page === pageId);
            });
        }

        navItems.forEach(item => {
            item.addEventListener('click', () => {
                const page = item.dataset.page;
                if (page) switchPage(page);
            });
        });

        // --- Кнопка включения ---
        btnToggle.addEventListener('click', () => {
            isConnected = !isConnected;
            updateToggleUI();
            // Имитация подключения/отключения
            if (isConnected) {
                statusText.textContent = 'Подключено';
                statusText.className = 'status-text connected';
                // Можно добавить вибрацию (если в WebView)
                if (navigator.vibrate) navigator.vibrate(30);
            } else {
                statusText.textContent = 'Отключено';
                statusText.className = 'status-text disconnected';
            }
        });

        function updateToggleUI() {
            btnToggle.classList.toggle('active', isConnected);
            const icon = btnToggle.querySelector('.inner i');
            if (isConnected) {
                icon.className = 'fas fa-lock';
            } else {
                icon.className = 'fas fa-power-off';
            }
        }

        // --- Управление подписками ---
        function renderSubscriptions() {
            subList.innerHTML = '';
            if (subscriptions.length === 0) {
                emptyMsg.style.display = 'block';
                subCount.textContent = '0';
                return;
            }
            emptyMsg.style.display = 'none';
            subCount.textContent = subscriptions.length;
            subscriptions.forEach((url, index) => {
                const li = document.createElement('li');
                const urlSpan = document.createElement('span');
                urlSpan.className = 'url';
                urlSpan.textContent = url;
                const delBtn = document.createElement('button');
                delBtn.className = 'del-btn';
                delBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeSubscription(index);
                });
                li.appendChild(urlSpan);
                li.appendChild(delBtn);
                subList.appendChild(li);
            });
        }

        function addSubscription() {
            const url = subInput.value.trim();
            if (!url) return alert('Введите URL подписки');
            // Простая валидация
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                alert('URL должен начинаться с http:// или https://');
                return;
            }
            subscriptions.push(url);
            saveData();
            renderSubscriptions();
            subInput.value = '';
        }

        function removeSubscription(index) {
            if (confirm('Удалить подписку?')) {
                subscriptions.splice(index, 1);
                saveData();
                renderSubscriptions();
            }
        }

        addSubBtn.addEventListener('click', addSubscription);
        subInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addSubscription();
        });

        // --- Инициализация ---
        loadData();
        // Если подписок нет, показываем пример
        if (subscriptions.length === 0) {
            // Для демонстрации добавим пару примеров (можно закомментировать)
            // subscriptions.push('https://example.com/sub1');
            // subscriptions.push('https://example.com/sub2');
            // saveData();
            // renderSubscriptions();
        }

        // Автоматически обновляем состояние кнопки при загрузке
        updateToggleUI();

        // Анимация фона (для красоты) - контент уже есть
        console.log('VPN Client ready!');
    </script>
</body>
</html>
